<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상영관 – 가상의 가족 극장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d3202f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div id="app"></div>
<script src="common.js"></script>
<script>
(() => {
  const { h, has, arr, obj, TITLES, workId, watchHref, poster, buildVideo, section, timeline, tools, toolList, roles, sourcesTable, href, mediaPath, boot, params, listing, metaLine, safeUrl, gallery } = App;

  boot((d, site, av) => {
    const name = has(site.name) ? site.name : '가상의 가족 극장';
    const T = { ...TITLES, ...obj(d.sectionTitles) };
    const works = arr(d.works), want = params.get('id');
    let idx = works.findIndex((w, i) => workId(w, i) === want);
    if (idx < 0 && !want && works.length) idx = 0;
    if (idx < 0) return { title: '작품을 찾을 수 없어요 – ' + name, main: h('main', { id: 'main', class: 'wrap notice card' },
      h('h1', { text: '작품을 찾을 수 없어요' }),
      h('p', { text: '주소가 잘못되었거나 작품이 삭제되었을 수 있어요.' }),
      h('a', { class: 'btn', href: href('works.html') }, '상영작에서 작품 고르기')) };

    const w = works[idx], v = w.video || {};
    const ser = has(w.series) ? arr(d.series).find(x => x.id === w.series) : null;
    const title = has(w.title) ? w.title : '제목 미정';
    const main = h('main', { id: 'main', class: 'pad' });

    // 상영관 – 플레이어
    const kind = w.kind === 'game' || w.kind === 'storyboard' ? w.kind : 'video';
    let screen, dl = null;
    if (kind === 'game') {   // 게임: 주소로 연결 (원하면 화면 안에서 바로 실행)
      const g = obj(w.game), url = safeUrl(g.url);
      screen = h('div', { class: 'screen-frame' }, !url ? h('div', { class: 'video-fallback' }, h('strong', { text: '게임 주소가 아직 없어요' }))
        : [g.embed && h('iframe', { class: 'game-frame', src: url, title: title + ' 게임', allow: 'fullscreen; gamepad', allowfullscreen: true,
            sandbox: 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups', loading: 'lazy' }),
          h('p', { class: 'game-cta' }, h('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener noreferrer' }, g.embed ? '새 창에서 열기' : '게임 하러 가기'))]);
      if (has(g.howto)) screen.append(h('p', { class: 'prose game-how', text: g.howto.trim() }));
    } else if (kind === 'storyboard') {   // 스토리보드: 장면 이미지 + PDF
      const sb = obj(w.storyboard), pages = arr(sb.pages).filter(x => x && has(x.file));
      screen = h('div', { class: 'screen-frame sb-frame' }, pages.length ? gallery(pages) : !has(sb.pdf) && h('div', { class: 'video-fallback' }, h('strong', { text: '스토리보드가 아직 없어요' })),
        has(sb.pdf) && h('p', { class: 'game-cta' }, h('a', { class: 'btn', href: mediaPath(sb.pdf), target: '_blank', rel: 'noopener noreferrer' }, 'PDF로 보기')));
    } else {
      dl = v.showDownload && has(v.file) && h('div', { class: 'dl' }, h('a', { class: 'btn ghost sm', href: mediaPath(v.file), download: '' }, '영상 다운로드'));
      screen = h('div', { class: 'screen-frame' }, buildVideo(v, title, () => dl && dl.remove()));
    }
    main.append(h('section', { class: 'screen', 'data-section': 'player', 'aria-label': '상영관' }, h('div', { class: 'wrap' }, screen, dl)));

    // 영화 정보
    const jumps = [];
    main.append(h('section', { class: 'movie', 'data-section': 'info', 'aria-label': '작품 정보' }, h('div', { class: 'wrap movie-grid' },
      h('div', {},
        h('h1', { text: title }),
        ser && h('p', { class: 'meta', text: `${ser.title} · ${has(w.episode) ? w.episode + '화' : '연재'}` }),
        has(v.duration) && h('p', { class: 'meta', text: '러닝타임 ' + v.duration.trim() }),
        has(w.tagline) && h('p', { class: 'tagline', text: w.tagline }),
        has(w.intent) && h('div', { id: 'intent' }, h('h2', { text: T.intent }), h('p', { class: 'prose', text: w.intent.trim() })),
        h('nav', { class: 'jump', 'aria-label': '이 작품의 섹션 이동', id: 'jump' })))));
    if (has(w.intent)) jumps.push(['intent', T.intent]);

    const add = (id, label, body) => { main.append(section(id, label, '', body)); jumps.push([id, label]); };
    const tl = timeline(w.process); if (tl) add('process', T.process, tl);
    if (toolList(w.tools).length) add('tools', T.tools, tools(w.tools));
    const ro = roles(w.roles, T); if (ro) add('roles', T.roles, ro);
    const src = sourcesTable(w.sources, T.sources); if (src) add('sources', T.sources, src);

    if (av.making) main.append(h('div', { class: 'wrap more' }, h('a', { class: 'btn ghost', href: href('making.html') }, '이 작품의 메이킹 더 보기')));

    if (ser) {   // 연재물: 회차 목록
      const eps = works.filter(e => e.series === ser.id).sort((a, b) => (+a.episode || 0) - (+b.episode || 0));
      main.append(section('episodes', ser.title + ' 회차', '', h('ol', { class: 'eps' }, eps.map(e =>
        h('li', {}, h('a', { href: watchHref(e, works.indexOf(e)), 'aria-current': e === w ? 'true' : null,
          text: `${has(e.episode) ? e.episode + '화' : '연재'} · ${has(e.title) ? e.title : '제목 미정'}` })))))); jumps.push(['episodes', '회차']);
    }
    const others = listing(d).filter(o => !(ser && o.seriesId === ser.id) && o.id !== w.id).map((o, i) => [o, i]);
    if (others.length) { main.append(section('others', T.others, '', h('div', { class: 'mini' }, others.map(([o, i]) =>
      h('a', { href: watchHref(o, i) }, poster(o),
        h('h3', { text: has(o.title) ? o.title : '제목 미정' }),
        has(metaLine(o)) && h('p', { class: 'meta', text: metaLine(o).replace('러닝타임 ', '') })))))); jumps.push(['others', T.others]); }

    const nav = main.querySelector('#jump');
    if (jumps.length > 1) jumps.forEach(([id, label]) => nav.append(h('a', { href: '#' + id, text: label })));
    else nav.remove();

    return { title: `${title} – ${name}`, main };
  });
})();
</script>
</body>
</html>
