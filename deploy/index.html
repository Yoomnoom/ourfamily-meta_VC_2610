<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 가족 극장</title>
<meta name="description" content="생성형 AI로 그려낸 가족 이야기를 상영하는 우리 가족 극장">
<meta property="og:type" content="website">
<meta property="og:site_name" content="우리 가족 극장">
<meta property="og:title" content="우리 가족 극장">
<meta property="og:description" content="생성형 AI로 그려낸 가족 이야기를 상영하는 우리 가족 극장">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d3202f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div id="app"></div>
<script src="common.js"></script>
<script>
(() => {
  const { h, has, arr, obj, mediaPath, watchHref, href, poster, section, gallery, tools: _t, toolList, boot, production, mediaStatus, isVideo } = App;
  const T0 = { works: '지금 상영 중', topics: '이 영화들이 담은 것', album: '비하인드 컷', making: '메이킹' };
  let current = 0;           // 카로셀 위치는 다시 그려도 유지한다

  /* ---------- 히어로 ---------- */
  function hero(d, site, av) {
    const hr = obj(d.hero);
    const title = has(hr.title) ? hr.title : (has(site.slogan) ? site.slogan : site.name);
    /* 대표 화면: 사진·영상을 차례로 이어서 보여 준다. 영상은 끝까지 재생하고, 사진은 정해진 시간(기본 5초) 동안 보여 준 뒤 다음으로 넘어가며, 마지막 다음에는 처음으로 돌아간다.
       공모전 발표용이라 심사위원 기기의 '움직임 줄이기'·'데이터 절약' 설정과 상관없이 소리 없는 영상은 항상 재생한다 (포스터 사진은 영상이 안 나올 때만 대신 쓴다) */
    const img = f => { const i = h('img', { class: 'hero-media', src: mediaPath(f), alt: '', 'aria-hidden': 'true' }); i.addEventListener('error', () => i.remove()); return i; };
    const list = [{ file: hr.mode === 'image' ? hr.image : hr.video, portrait: hr.mode === 'image' ? hr.imagePortrait : hr.videoPortrait }, ...arr(hr.more).map(x => ({ file: obj(x).file, portrait: obj(x).portrait }))].filter(x => has(x.file)), many = list.length > 1;
    const secs = Math.max(2, Math.min(60, +hr.photoSeconds || 5)), still_ = has(hr.poster) ? img(hr.poster) : null;
    const stage = h('div', { class: 'hero-stage' });
    let at = 0, fails = 0, timer = 0;
    const next = () => { at = (at + 1) % list.length; show(); };
    function show() {
      clearTimeout(timer);
      const tall = matchMedia('(max-aspect-ratio: 1/1)').matches, it = list[at], own = tall && has(it.portrait), f = own ? it.portrait : it.file;   // 세로 화면(휴대폰)에서는 세로용 사진·영상이 있으면 그것을 쓴다
      if (!isVideo(f)) {
        const i = img(f); if (own) i.classList.add('fill');
        i.addEventListener('load', () => { fails = 0; });
        i.addEventListener('error', () => { if (many && ++fails < list.length) next(); });
        stage.replaceChildren(i);
        if (many) timer = setTimeout(next, secs * 1000);
        return;
      }
      const v = h('video', { class: 'hero-media' + (own ? ' fill' : ''), muted: true, autoplay: true, loop: !many, playsinline: true, preload: 'auto', 'aria-hidden': 'true', tabindex: '-1', src: mediaPath(f) });
      if (has(hr.poster)) v.setAttribute('poster', mediaPath(hr.poster));
      v.muted = true; v.setAttribute('muted', ''); v.setAttribute('playsinline', '');   // 휴대폰(iOS)에서 자동 재생되려면 속성으로도 필요하다
      const st = mediaStatus(v, { errors: false });   // 인터넷이 느리거나 막힌 이유를 화면에 알려 준다
      if (many) v.addEventListener('ended', next);
      v.addEventListener('error', () => { if (many && ++fails < list.length) next(); else { st.fail(v.error && v.error.code); stage.replaceChildren(...(still_ ? [still_] : []), st.el); } });
      v.addEventListener('playing', () => { fails = 0; });
      v.play && v.play().catch(e => { if (e && e.name === 'NotAllowedError') { st.say('자동 재생이 막혀 있어요.\n화면을 한 번 누르면 재생돼요.', 'info'); document.addEventListener('pointerdown', () => v.play().catch(() => {}), { once: true }); } });
      stage.replaceChildren(v, st.el);
    }
    const media = [];
    if (list.length) { show(); media.push(stage); } else if (still_) media.push(still_);
    return h('section', { class: 'hero', 'data-section': 'hero', 'aria-label': '대표 화면' }, media,
      h('div', { class: 'wrap hero-in' },
        h('h1', { text: title || '' }),
        has(hr.text) && h('p', { text: hr.text }),
        h('div', { class: 'hero-cta' },
          av.works && h('a', { class: 'btn', href: '#now', text: has(hr.ctaWatch) ? hr.ctaWatch : '지금 관람하기' }),
          av.making && h('a', { class: 'btn ghost', href: href('making.html'), text: has(hr.ctaMaking) ? hr.ctaMaking : '메이킹 보기' }))));
  }

  /* ---------- 카로셀 ---------- */
  function carousel(works) {
    const n = works.length;
    current = Math.max(0, Math.min(current, n - 1));
    let swallow = false, startX = null;
    const loop = n > 2;   // 3개 이상이면 원형: 처음에서 이전은 마지막, 마지막에서 다음은 처음

    const live = h('p', { class: 'sr', 'aria-live': 'polite' });
    const prev = h('button', { type: 'button', class: 'arrow prev', 'aria-label': '이전 작품', text: '‹' });
    const next = h('button', { type: 'button', class: 'arrow next', 'aria-label': '다음 작품', text: '›' });
    const stage = h('div', {
      class: 'stage', role: 'group', 'aria-roledescription': 'carousel', 'aria-label': '상영작 목록', tabindex: n > 1 ? '0' : null
    });

    const slides = works.map((w, i) => {
      const title = has(w.title) ? w.title : '제목 미정';
      const link = h('a', { class: 'btn', href: watchHref(w, i) }, '관람하기', h('span', { class: 'sr', text: ' – ' + title }));
      const pLink = h('a', { href: watchHref(w, i), tabindex: '-1', 'aria-hidden': 'true' }, poster(w));
      const slide = h('article', { class: 'slide', 'aria-roledescription': 'slide', 'aria-label': `${i + 1} / ${n}` },
        pLink,
        h('div', { class: 'slide-info' },
          h('h3', { text: title }),
          has(App.metaLine(w)) && h('p', { class: 'meta', text: App.metaLine(w) }),
          link));
      slide.addEventListener('click', e => {
        if (swallow) { e.preventDefault(); return; }
        if (i !== current) { e.preventDefault(); e.stopPropagation(); go(i); }
      }, true);
      stage.append(slide);
      return { slide, link, pLink };
    });

    const dots = n > 1 ? h('div', { class: 'dots' }, works.map((w, i) =>
      h('button', { type: 'button', class: 'dot', 'aria-label': `${i + 1}번째 작품: ${w.title || '제목 미정'}`, onclick: () => go(i) }))) : null;

    function paint(announce) {
      slides.forEach(({ slide, link, pLink }, i) => {
        let off = i - current;
        if (loop) off = ((off + Math.floor(n / 2)) % n + n) % n - Math.floor(n / 2);   // -n/2 ~ n/2 사이로 접는다
        const abs = Math.abs(off);
        // 한쪽 끝에서 반대쪽 끝으로 넘어가는 카드는 화면을 가로질러 날아가지 않게 애니메이션 없이 옮긴다
        const jump = loop && slide._off != null && Math.abs(off - slide._off) > 1;
        if (jump) slide.style.setProperty('transition', 'none', 'important');
        slide._off = off;
        slide.style.setProperty('--o', Math.max(-2, Math.min(2, off)));
        slide.style.setProperty('--s', abs === 0 ? 1 : abs === 1 ? .8 : .66);
        slide.style.setProperty('--op', abs === 0 ? 1 : abs === 1 ? .4 : 0);
        slide.style.zIndex = 10 - abs;
        slide.classList.toggle('active', abs === 0);
        slide.classList.toggle('far', abs > 1);
        slide.setAttribute('aria-hidden', abs === 0 ? 'false' : 'true');
        link.tabIndex = abs === 0 ? 0 : -1;
        if (jump) { void slide.offsetWidth; slide.style.removeProperty('transition'); }
      });
      prev.disabled = !loop && current === 0; next.disabled = !loop && current === n - 1;
      if (dots) [...dots.children].forEach((d, i) => d.setAttribute('aria-current', i === current ? 'true' : 'false'));
      if (announce) live.textContent = `${current + 1} / ${n}: ${works[current].title || '제목 미정'}`;
    }
    function go(i) { current = loop ? (i % n + n) % n : Math.max(0, Math.min(n - 1, i)); paint(true); }

    prev.addEventListener('click', () => go(current - 1));
    next.addEventListener('click', () => go(current + 1));
    stage.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(current + 1); }
    });
    // 스와이프 (터치·마우스 드래그)
    stage.addEventListener('pointerdown', e => { startX = e.clientX; });
    const end = e => {
      if (startX == null) return;
      const dx = e.clientX - startX; startX = null;
      if (Math.abs(dx) > 40 && n > 1) {
        swallow = true; setTimeout(() => swallow = false, 60);
        go(current + (dx < 0 ? 1 : -1));
      }
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', () => { startX = null; });

    paint(false);
    const box = h('div', { class: 'carousel' }, stage, n > 1 && prev, n > 1 && next, dots, live);

    // 자동 넘김: 3초마다 다음 작품(마지막 다음엔 처음으로). 마우스를 올리거나 포커스·터치 중, 탭이 숨겨진 동안 멈춘다. '동작 줄이기' 설정에서도 돌지만, 그때는 CSS 가 전환 애니메이션을 없애 카드가 바로 바뀐다.
    if (n > 1) {
      let hold = false, tick = null;
      const stop = () => { clearInterval(tick); tick = null; };
      const start = () => { if (tick || hold || document.hidden) return; tick = setInterval(() => {
        if (!box.isConnected) return stop();
        go(current + 1); }, 3000); };
      const pause = () => { hold = true; stop(); }, resume = () => { hold = false; start(); };
      box.addEventListener('mouseenter', pause); box.addEventListener('mouseleave', resume);
      box.addEventListener('focusin', pause); box.addEventListener('focusout', resume);
      box.addEventListener('touchstart', pause, { passive: true });
      box.addEventListener('touchend', () => setTimeout(resume, 8000));   // 손을 뗀 뒤 8초 쉬었다가 다시 시작
      document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
      start();
    }
    return box;
  }

  /* ---------- 렌더 ---------- */
  boot((d, site, av) => {
    const home = obj(d.home), T = { ...T0, ...obj(home.titles) };
    if (T.album === '가족 앨범') T.album = T0.album;   // CMS에 예전 이름이 저장돼 있어도 "비하인드 컷"으로 보인다
    const works = App.listing(d);
    const main = h('main', { id: 'main' });
    main.append(hero(d, site, av));

    if (works.length) main.append(section('now', T.works, '', carousel(works)));

    const TOPIC_GO = ['works.html', 'album.html', 'making.html'];   // 카드 순서대로 이동할 페이지 (연결→상영작, 발견→비하인드 컷, 즐거움→메이킹)
    const topics = arr(home.topics).filter(t => has(t.title) || has(t.text));
    if (topics.length) main.append(section('topics', T.topics, '', h('div', { class: 'topics' }, topics.map((t, i) =>
      h(TOPIC_GO[i] ? 'a' : 'article', TOPIC_GO[i] ? { class: 'topic go', href: href(TOPIC_GO[i]) } : { class: 'topic' },
        has(t.label) && h('span', { class: 'tag', text: t.label }),
        has(t.title) && h('h3', { text: t.title }),
        has(t.text) && h('p', { text: t.text }),
        TOPIC_GO[i] && h('span', { class: 'go-arrow', 'aria-hidden': 'true', text: '→' }))))));

    const photos = arr(obj(d.album).photos).filter(g => has(g.file) || has(g.caption)).slice(0, 6);
    if (photos.length) main.append(section('album', T.album, '', ...gallery(photos),
      h('a', { class: 'btn ghost', href: href('album.html') }, '비하인드 컷 전체보기')));

    if (av.making) {
      const names = [...new Set([...toolList(obj(d.making).tools), ...works.flatMap(w => toolList(production(w, d).tools))].map(t => (t.name || '').trim()).filter(Boolean))];
      main.append(section('making', T.making, '',
        names.length > 0 && h('ul', { class: 'toolnames', 'aria-label': '사용한 AI 도구' }, names.map(n => h('li', { text: n }))),
        h('a', { class: 'btn ghost', href: href('making.html') }, '메이킹 전체보기')));
    }

    return { title: has(site.name) ? site.name + (has(site.slogan) ? ' – ' + site.slogan : '') : '우리 가족 극장', main };
  });
})();
</script>
</body>
</html>
