<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소개 – 우리 가족 극장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d3202f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div id="app"></div>
<script src="common.js"></script>
<script>
(() => {
  const { h, has, arr, obj, TITLES, section, pagehead, emptyPage, sourcesTable, mediaPath, boot } = App;
  boot((d, site, av) => {
    const title = '소개 – ' + (has(site.name) ? site.name : '우리 가족 극장');
    const ab = obj(d.about), pr = obj(ab.producer), T = { ...TITLES, ...obj(d.sectionTitles) };
    if (!av.about) return { title, main: emptyPage('소개') };
    const main = h('main', { id: 'main', class: 'pad' }, pagehead('소개'));
    const mem = arr(pr.members).filter(m => has(m.name) || has(m.role) || has(m.text) || has(m.photo));
    const team = mem.length ? h('ul', { class: 'team' }, mem.map(m => h('li', {},
      h('div', { class: 'avatar' }, has(m.photo) ? h('img', { src: mediaPath(m.photo), alt: has(m.name) ? m.name + ' 프로필' : '', loading: 'eager', decoding: 'async', draggable: 'false' }) : null),
      h('div', {}, has(m.name) && h('h4', { text: m.name }), has(m.role) && h('b', { text: m.role }), has(m.text) && h('p', { raw: true, text: m.text.trim() }))))) : null;
    if (has(pr.name) || has(pr.text) || team) main.append(section('producer', T.producer, '', h('div', { class: 'who' },
      has(pr.name) && h('h3', { text: pr.name }), has(pr.text) && h('p', { class: 'prose', raw: true, text: pr.text.trim() }), team)));
    if (has(ab.intent)) main.append(section('intent', T.intent, '', h('p', { class: 'prose', raw: true, text: ab.intent.trim() })));
    const src = sourcesTable(ab.sources, T.sources);
    if (src) main.append(section('sources', T.sources, '', src));
    if (has(site.contestName) || has(site.contestInfo)) main.append(section('contest', T.contest, '', h('div', { class: 'contest' },
      has(site.contestName) && h('h3', { text: site.contestName }), has(site.contestInfo) && h('p', { class: 'prose' }, App.linkify(site.contestInfo.trim())))));
    return { title, main };
  });
})();
</script>
</body>
</html>
