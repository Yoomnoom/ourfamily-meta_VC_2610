<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소개 – 가상의 가족 극장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d3202f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div id="app"></div>
<script src="common.js"></script>
<script>
(() => {
  const { h, has, arr, obj, TITLES, section, pagehead, emptyPage, sourcesTable, boot } = App;
  boot((d, site, av) => {
    const title = '소개 – ' + (has(site.name) ? site.name : '가상의 가족 극장');
    const ab = obj(d.about), pr = obj(ab.producer), T = { ...TITLES, ...obj(d.sectionTitles) };
    if (!av.about) return { title, main: emptyPage('소개') };
    const main = h('main', { id: 'main', class: 'pad' }, pagehead('소개'));
    if (has(pr.name) || has(pr.text)) main.append(section('producer', T.producer, '', h('div', { class: 'who' },
      has(pr.name) && h('h3', { text: pr.name }), has(pr.text) && h('p', { class: 'prose', text: pr.text.trim() }))));
    if (has(ab.intent)) main.append(section('intent', T.intent, '', h('p', { class: 'prose', text: ab.intent.trim() })));
    const src = sourcesTable(ab.sources, T.sources);
    if (src) main.append(section('sources', T.sources, '', src));
    if (has(site.contestName) || has(site.contestInfo)) main.append(section('contest', T.contest, '', h('div', { class: 'contest' },
      has(site.contestName) && h('h3', { text: site.contestName }), has(site.contestInfo) && h('p', { class: 'prose', text: site.contestInfo.trim() }))));
    return { title, main };
  });
})();
</script>
</body>
</html>
