<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상영작 – 우리 가족 극장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d3202f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div id="app"></div>
<script src="common.js"></script>
<script>
(() => {
  const { h, has, arr, obj, watchHref, poster, pagehead, emptyPage, boot, listing, metaLine } = App;
  boot((d, site, av) => {
    const name = has(site.name) ? site.name : '우리 가족 극장';
    const title = '상영작 – ' + name;
    const works = listing(d).map((w, i) => [w, i]);
    if (!works.length) return { title, main: emptyPage('상영작') };
    // 종류별로 나눠 보여 준다: 영상 · 게임 · 웹앱 (스토리보드가 있으면 그것도). 종류가 하나뿐이면 나누지 않고 알약으로 보여 준다.
    const KINDS = [['video', '영상'], ['game', '게임'], ['app', '웹앱'], ['storyboard', '스토리보드']];
    const groups = KINDS.map(([k, label]) => [k, label, works.filter(([w]) => App.kindOf(w) === k)]).filter(g => g[2].length);
    const split = groups.length > 1;
    const card = ([w, i]) => h('li', {},
      h('a', { class: 'wcard', href: watchHref(w, i) }, poster(w),
        h('h3', { text: has(w.title) ? w.title : '제목 미정' }),
        (!split || has(metaLine(w))) && h('p', { class: 'meta' }, !split && App.kindPill(w), metaLine(w)),
        has(w.tagline) && h('p', { class: 'wcard-tag', text: w.tagline.trim() })));   // 한 줄 소개 (마우스를 올리지 않아도 보인다)
    const body = split
      ? groups.map(([k, label, list]) => h('section', { class: 'kind-sec', 'data-k': k, 'aria-labelledby': 'kg-' + k },
          h('h2', { class: 'kind-head', id: 'kg-' + k }, label, h('span', { class: 'n', text: String(list.length) })),
          h('ul', { class: 'works-grid' }, list.map(card))))
      : h('ul', { class: 'works-grid' }, works.map(card));
    // 종류 거르기: 전체 · 영상 · 게임 · 웹앱 (종류가 둘 이상일 때만). 누르면 해당 종류만 보인다.
    const tabs = split && h('div', { class: 'kind-tabs', role: 'tablist', 'aria-label': '작품 종류' },
      [['all', '전체'], ...groups.map(([k, label]) => [k, label])].map(([k, label], i) =>
        h('button', { type: 'button', role: 'tab', class: 'kt' + (i ? '' : ' on'), 'aria-selected': i ? 'false' : 'true', 'data-k': k, text: label })));
    if (tabs) tabs.addEventListener('click', e => {
      const b = e.target.closest('button.kt'); if (!b) return;
      tabs.querySelectorAll('button.kt').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-selected', on ? 'true' : 'false'); });
      document.querySelectorAll('.kind-sec').forEach(sec => { sec.hidden = b.dataset.k !== 'all' && sec.dataset.k !== b.dataset.k; });
    });
    return { title, main: h('main', { id: 'main', class: 'pad' }, pagehead('상영작', '가족의 기억과 일상에서 출발한 이야기를 만나 보세요.\n영상을 감상하고, 게임과 웹앱을 직접 체험할 수 있어요.'),
      h('section', { class: 'page', 'data-section': 'list', 'aria-label': '상영작 목록' }, h('div', { class: 'wrap' }, tabs, body))) };
  });
})();
</script>
</body>
</html>
