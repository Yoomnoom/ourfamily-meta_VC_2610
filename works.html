<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상영작 – 가상의 가족 극장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d3202f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div id="app"></div>
<script src="common.js"></script>
<script>
(() => {
  const { h, has, arr, obj, watchHref, poster, pagehead, emptyPage, boot } = App;
  boot((d, site, av) => {
    const name = has(site.name) ? site.name : '가상의 가족 극장';
    const title = '상영작 – ' + name;
    const works = arr(d.works).map((w, i) => [w, i]).filter(([w]) => w && (has(w.id) || has(w.title)));
    if (!works.length) return { title, main: emptyPage('상영작') };
    return { title, main: h('main', { id: 'main', class: 'pad' }, pagehead('상영작'),
      h('section', { class: 'page', 'data-section': 'list', 'aria-label': '상영작 목록' }, h('div', { class: 'wrap' },
        h('ul', { class: 'works-grid' }, works.map(([w, i]) => h('li', {},
          h('a', { class: 'wcard', href: watchHref(w, i) }, poster(w),
            h('h3', { text: has(w.title) ? w.title : '제목 미정' }),
            has(w.video && w.video.duration) && h('p', { class: 'meta', text: '러닝타임 ' + w.video.duration.trim() })))))))) };
  });
})();
</script>
</body>
</html>
