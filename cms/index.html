<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리 페이지 – 우리 가족 극장</title>
<style>
/* Pretendard – SIL Open Font License 1.1 (media/fonts/Pretendard-LICENSE.txt) */
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:url("media/fonts/Pretendard-Regular.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:500;font-style:normal;font-display:swap;src:url("media/fonts/Pretendard-Medium.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:700;font-style:normal;font-display:swap;src:url("media/fonts/Pretendard-Bold.woff2") format("woff2")}
:root{
  --cream:#fff8ec; --paper:#fffdf7; --line:#e3d4b6; --ink:#3a2f26; --muted:#6a5b4d; --field:#8a7a62;
  --mint:#c3ead9; --yellow:#ffe7a0; --sky:#c2e1f6; --sky-d:#1d6694;
  --ok:#16684e; --ph:#8a5a00; --bad:#b3261e; --warn-bg:#fff0c2; --ghost:#857868;
  --hand:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sans:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hdr:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:1.0625rem}
:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:700;font-size:.95rem}
.btn:hover{background:var(--yellow)}
.btn.primary{background:var(--mint)} .btn.primary:hover{background:#a9e0c7}
.rng-row{display:flex;align-items:center;gap:10px;max-width:420px}
.rng-row.rr{max-width:none;flex-wrap:wrap;gap:8px 16px}
.rr-item{display:flex;align-items:center;gap:8px;flex:1 1 150px;min-width:150px;font-weight:700;font-size:.9rem;margin:0}
.rr-item span{flex:none}
.rr-item output{width:3.2em}
.rng-row input[type=range]{flex:1;min-width:0;padding:0;margin:0}
.rng-row output{flex:none;width:3.4em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.btn.sm{min-height:36px;padding:2px 12px;font-size:.88rem;border-width:1.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)} .btn.danger:hover{background:#fde8e6}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 상단 바: 작품 선택 · 저장 상태 · 미리보기 · 저장 · 더보기 */
header.top{position:sticky;top:0;z-index:40;background:rgba(255,248,236,.98);border-bottom:2px solid var(--line)}
.top-in{display:flex;gap:10px 14px;align-items:center;padding:8px 20px}
.top-in .grow{flex:1}
.top-in select{max-width:min(380px,36vw);font-weight:700}
.status{font-size:.9rem;line-height:1.35;text-align:right}
.status b.ok{color:var(--ok)} .status b.dirty{color:var(--bad)}
.status small{display:block;color:var(--muted);font-size:.8rem}
.moreWrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:250px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(58,47,38,.25)}
.menu .mi{display:flex;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 12px;min-height:40px;font-weight:500;color:var(--ink);align-items:center}
.menu .mi:hover{background:var(--yellow)}
.menu .mi.danger{color:var(--bad)}
.menu .mi:disabled{opacity:.4;cursor:not-allowed}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .mh{font-size:.8rem;color:var(--muted);padding:6px 12px 2px;font-weight:700}
.folder-banner{display:flex;gap:12px;align-items:center;padding:6px 20px;background:var(--warn-bg);border-top:1px solid #e6bc4d;font-size:.92rem}

/* 3단 화면: 단계 목록 | 지금 단계 | 사이트에서 나올 모습 */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:20px;max-width:1700px;margin:0 auto;align-items:start}
@media(min-width:1280px){.app{grid-template-columns:250px minmax(0,1fr) clamp(400px,34vw,640px)}body.pv-hidden .app{grid-template-columns:250px minmax(0,1fr)}}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr);padding:12px}}

.steps{position:sticky;top:calc(var(--hdr) + 12px);max-height:calc(100vh - var(--hdr) - 28px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px}
.todo{display:block;width:100%;text-align:left;border:2px solid var(--ink);background:var(--yellow);border-radius:12px;font-weight:700;padding:8px 12px;min-height:42px;margin-bottom:8px}
.todo.done{background:#e4f6ee;border-color:var(--ok);color:var(--ok);cursor:default}
.steps h2{font-size:.85rem;color:var(--muted);margin:10px 8px 4px;font-family:var(--sans)}
.stp{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:8px 8px;min-height:44px;font-weight:500;color:var(--ink)}
.stp:hover{background:var(--yellow)}
.stp[aria-current=step]{background:var(--mint);font-weight:700}
.stp .req{margin-left:auto;flex:none}
.stp .no{font-weight:700;color:var(--muted);min-width:1.1em}
.ic{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--field);display:grid;place-items:center;font-size:.75rem;font-weight:700;background:#fff;color:#fff}
.ic.done{background:var(--ok);border-color:var(--ok)}
.ic.work{border-color:var(--ph);background:linear-gradient(90deg,var(--ph) 50%,#fff 50%)}
@media(max-width:820px){.steps{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px}.steps h2{display:none}.stp{flex:none;width:auto;white-space:nowrap}.todo{flex:none;width:auto;margin:0}}

.stepmain{min-width:0}
.stepno{font-size:.9rem;color:var(--muted);font-weight:700}
.stephead h1{font-family:var(--hand);font-size:1.9rem;margin:2px 0 6px;line-height:1.25}
.why{margin:0 0 16px;color:var(--muted);white-space:pre-line}
.stepbody{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 20px 20px}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
details.part{border-bottom:1px solid var(--line);padding:6px 0}
details.part:last-child{border-bottom:0}
details.part>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;font-family:var(--hand);font-weight:700;font-size:1.2rem}
details.part>summary::-webkit-details-marker{display:none}
details.part>summary::before{content:"▾";color:var(--muted);font-size:.9rem}
details.part:not([open])>summary::before{content:"▸"}
details.part>summary small{font-family:var(--sans);font-weight:500;color:var(--muted);font-size:.85rem}
.pdesc{margin:0 0 12px;color:var(--muted);font-size:.93rem;white-space:pre-line}

/* 사이트에서 나올 모습 */
#pvpane{display:flex;flex-direction:column;background:#0d0b10;border:2px solid var(--ink);border-radius:16px;overflow:hidden;position:sticky;top:calc(var(--hdr) + 12px);height:calc(100vh - var(--hdr) - 28px)}
.pv-head{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--paper);border-bottom:2px solid var(--line)}
.pv-head b{font-family:var(--hand);font-size:1.15rem;margin-right:auto}
.pv-head select{max-width:190px;min-height:36px;padding:4px 8px}
#pvpane iframe{flex:1;border:0;width:100%;background:#0d0b10}
#btnPV{display:inline-flex}
@media(max-width:1279px){
  #pvpane{position:fixed;inset:0;z-index:70;border:0;border-radius:0;height:auto;display:none}
  body.pv-open #pvpane{display:flex}
}
@media(min-width:1280px){#pvClose{display:none} body.pv-hidden #pvpane{display:none}}

/* 폼 */
.field{margin-bottom:18px}
.field>label{display:block;font-weight:700;font-size:1rem;margin-bottom:5px}
.req{display:inline-block;margin-left:8px;font-size:.75rem;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:999px;padding:0 8px;vertical-align:middle}
.hint{display:block;font-size:.88rem;color:var(--muted);margin-top:4px;white-space:pre-line}
input[type=text],textarea,select.fld{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:#fff;border:1.5px solid var(--field);border-radius:12px;padding:11px 14px}
textarea{resize:vertical;min-height:96px;line-height:1.6}
textarea.big{min-height:180px;font-family:ui-monospace,"Cascadia Mono",Consolas,var(--sans);font-size:1rem;white-space:pre-wrap;tab-size:2}
input:focus,textarea:focus,select:focus{border-color:var(--sky-d)}
::placeholder{color:#a39684;opacity:1}
select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--field);border-radius:12px;padding:8px 12px;min-height:42px}
.cb{display:flex;gap:10px;align-items:center;font-weight:700}
.cb input{width:22px;height:22px;accent-color:var(--ok)}
.sub-title{font-weight:700;margin:8px 0 6px}
/* [예시] 값: 회색 글자 + "예시" 표시, 클릭하면 전체 선택 */
.exw{position:relative;display:block}
.exw .pill{display:none;position:absolute;right:10px;top:9px;font-size:.72rem;font-weight:700;background:var(--yellow);color:var(--ph);border-radius:999px;padding:0 9px;pointer-events:none}
.exw.ex .pill{display:block}
.exw.ex input,.exw.ex textarea{color:var(--ghost)}
.exw.ex input,.exw.ex textarea{padding-right:60px}
details.adv{margin:4px 0 14px;border:1.5px dashed var(--line);border-radius:12px;padding:2px 14px}
details.adv>summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--muted);font-weight:700}
details.adv[open]{padding-bottom:10px}
.list{display:grid;gap:12px;margin-bottom:10px}
.item{border:1.5px solid var(--line);border-radius:16px;background:#fffaf0;padding:14px}
.item .item{background:#fff}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.item-head b{font-family:var(--hand);font-size:1.2rem}
.item-tools{display:flex;gap:6px;flex-wrap:wrap}
.epbox{border:1.5px solid var(--line);border-radius:16px;background:#fffaf0;padding:14px;margin-top:14px}
.epbox h3{font-family:var(--hand);font-size:1.2rem;margin:0 0 8px}
.eplist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.eplist li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.grip{cursor:grab;user-select:none;padding:4px 8px;border-radius:8px;color:var(--muted);font-size:1.1rem;line-height:1;border:1.5px dashed var(--line);background:#fff}
.over{outline:3px dashed var(--sky-d);outline-offset:2px}
.dragging{opacity:.45}
.two{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1fr 1fr}}

/* 표 (출처·저작권) */
.tbl{overflow-x:auto;margin-bottom:10px;border:1.5px solid var(--line);border-radius:14px}
.tbl table{width:100%;border-collapse:collapse;min-width:820px}
.tbl th{background:#fbefd5;text-align:left;padding:8px 10px;font-size:.9rem;border-bottom:1.5px solid var(--line)}
.tbl td{padding:0;border-bottom:1px solid var(--line);vertical-align:top;background:#fff}
.tbl tr:last-child td{border-bottom:0}
.tbl input.cell{border:0;border-radius:0;padding:12px 10px;font-size:1rem;background:transparent}
.tbl input.cell:focus{background:#eaf5fc;outline:2px solid var(--sky-d);outline-offset:-2px}
.tbl .exw .pill{top:12px}
.tbl td.act{white-space:nowrap;padding:6px;width:1%;background:#fffaf0}
.tbl td.act .item-tools{flex-wrap:nowrap;align-items:center}
.tbl td.act .btn,.tbl td.act .grip{padding:4px 8px;font-size:.85rem;flex:none}
.tbl td.act{vertical-align:middle}
.tbl tr.auto td{background:#f4efe4}

/* 파일 입력 */
.filebox{display:flex;gap:14px;align-items:center;border:2px dashed var(--field);border-radius:14px;padding:10px 12px;background:#fff;flex-wrap:wrap}
.filebox.drag{background:#eaf5fc;border-color:var(--sky-d)}
.filebox.empty{background:#fffaf0}
.f-thumb{width:96px;height:64px;border-radius:8px;background:#efe6d0;overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.f-thumb img,.f-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.f-info{flex:1;min-width:180px}
.f-name{font-weight:700;word-break:break-all}
.f-meta{font-size:.86rem;color:var(--muted)}
.f-meta.bad{color:var(--bad);font-weight:700} .f-meta.ok{color:var(--ok)}
.f-btns{display:flex;gap:6px}
.dropmulti{border:2px dashed var(--field);border-radius:14px;padding:16px;text-align:center;background:#fffaf0;margin-bottom:12px;color:var(--muted)}
.dropmulti.drag{background:#eaf5fc;border-color:var(--sky-d)}
.dropmulti .btn{margin-top:6px}

#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.95rem;display:flex;gap:12px;align-items:center;white-space:pre-line}
.toast button{background:var(--yellow);color:var(--ink);border:0;border-radius:999px;font-weight:700;padding:4px 14px;min-height:32px}
dialog#pickPrev{border:2px solid var(--ink);border-radius:20px;background:var(--paper);color:var(--ink);padding:22px 26px;width:min(680px,94vw);max-height:86vh;overflow:auto}
dialog#pickPrev::backdrop{background:rgba(58,47,38,.55)}
dialog#pickPrev h2{font-family:var(--hand);margin:0 0 6px}
dialog#pickPrev .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:-22px;background:var(--paper);padding:10px 0}
.pk-group{margin:12px 0}
.pk-group h3{font-size:1.05rem;margin:0 0 4px}
.pk-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-top:6px;cursor:pointer}
.pk-row input{margin-top:4px;flex:none}
.pk-row small{display:block;color:var(--muted);margin-top:2px}
dialog#intro{border:2px solid var(--ink);border-radius:20px;background:var(--paper);color:var(--ink);padding:24px 28px;max-width:min(520px,92vw)}
dialog#intro::backdrop{background:rgba(58,47,38,.45)}
dialog#intro h2{font-family:var(--hand);margin:0 0 10px}
dialog#intro ol{margin:0 0 16px;padding-left:22px}
dialog#intro li{margin-bottom:6px}
input[type=email],input[type=password]{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:#fff;border:1.5px solid var(--field);border-radius:12px;padding:11px 14px}
dialog#login,dialog#editors,dialog#stats,dialog#confirmDel{border:2px solid var(--ink);border-radius:20px;background:var(--paper);color:var(--ink);padding:24px 28px;width:min(440px,92vw)}
dialog#stats{width:min(800px,96vw);max-height:92vh;overflow:auto}
dialog#login::backdrop,dialog#editors::backdrop,dialog#stats::backdrop,dialog#confirmDel::backdrop{background:rgba(58,47,38,.55)}
dialog#login h2,dialog#editors h2,dialog#stats h2,dialog#confirmDel h2{font-family:var(--hand);margin:0 0 10px}
dialog#confirmDel input{width:100%;box-sizing:border-box}
dialog#login .row,dialog#editors .row,dialog#confirmDel .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.prodbar{margin:0 0 16px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--paper);display:grid;gap:8px}
.prodrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
fieldset.ro{border:0;padding:0;margin:0;min-width:0;opacity:.78}
.ro-note{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--warn-bg);font-weight:700;white-space:pre-line}
.ro-row{opacity:.78}
.login-msg{white-space:pre-line;min-height:1.4em;margin:10px 0 0;color:#a3341b;font-size:.95rem}
.ed-list{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
dialog#editors{width:min(680px,94vw)}
.ed-list li{display:grid;grid-template-columns:7em minmax(0,1fr) auto auto;gap:10px;align-items:center;word-break:break-all}
.ed-who{display:contents}
.ed-who strong{font-size:1.05em;word-break:keep-all}
.ed-who .btn.sm{white-space:nowrap}
/* 비하인드 컷 '같은 장면의 사진·영상': 세로로 길게 쌓지 않고 작은 칸으로 나란히 */
.listhost[data-l="more"]>.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.listhost[data-l="more"] .item{margin:0;padding:8px}
.listhost[data-l="more"] .item-head{margin:0 0 6px}
.listhost[data-l="more"] .item-head b{font-size:.82rem}
.listhost[data-l="more"] .item-tools>:nth-child(2){display:none}
.listhost[data-l="more"] .field~.field{display:none}
.listhost[data-l="more"] .filebox{flex-direction:column;align-items:stretch}
.listhost[data-l="more"] .f-info{display:none}
.listhost[data-l="more"] .f-thumb{width:100%;height:90px}
.listhost[data-l="more"] .f-btns{justify-content:center}
.listhost[data-l="more"] .filebox~*{display:none}
.listhost[data-l="more"]>.list{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.listhost[data-l="more"] .item-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:nowrap}
.listhost[data-l="more"] .item-head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.listhost[data-l="more"] .btn.sm{white-space:nowrap;padding:5px 10px;min-width:0;flex:none}
.listhost[data-l="more"] .item-tools{flex:none}
.listhost[data-l="more"] .f-btns{display:flex;flex-direction:row;gap:6px;flex-wrap:nowrap}
.listhost[data-l="more"] .f-btns .btn{flex:1}
/* 사진 끌어서 썸네일 위치 맞추기 */
.filebox.fbfocus{flex-direction:column;align-items:stretch}
.f-thumb.focusable{position:relative;width:100%;max-width:320px;height:auto;aspect-ratio:4/3;cursor:grab;touch-action:none;user-select:none;margin:0 auto}
.f-thumb.focusable:active{cursor:grabbing}
.f-thumb.focusable img,.f-thumb.focusable video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.f-thumb.focusable{border-radius:14px;overflow:hidden}

.f-thumb.focusable img,.f-thumb.focusable video{pointer-events:none}
.f-thumb .fhint{position:absolute;left:6px;bottom:6px;padding:2px 8px;border-radius:999px;background:rgba(20,16,12,.75);color:#fff;font-size:.72rem;pointer-events:none}
.listhost[data-l="more"] .f-thumb.focusable{height:auto;aspect-ratio:4/3}
.f-thumb.framed{overflow:hidden;background:#111;position:relative}
.f-thumb .fin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.f-thumb.framed img,.f-thumb.framed video{object-fit:fill}
.listhost[data-l="more"] .fhint{display:none}
.f-thumb .ffr{position:absolute;box-shadow:0 0 0 999px rgba(0,0,0,.7);border:2px solid #fff;box-sizing:border-box;pointer-events:none}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <label for="workSel" style="position:absolute;left:-9999px">작품 선택</label>
    <select id="workSel"></select>
    <label for="epSel" style="position:absolute;left:-9999px">회차 선택</label>
    <select id="epSel" hidden></select>
    <span class="grow"></span>
    <div class="status" id="status" aria-live="polite"></div>
    <button class="btn" id="btnPV" type="button">미리보기</button>
    <button class="btn primary" id="btnSave" type="button">저장 (Ctrl+S)</button>
    <div class="moreWrap">
      <button class="btn" id="btnMore" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="더보기">⋯</button>
      <div class="menu" id="menu" role="menu" hidden></div>
    </div>
    <input id="fileImport" type="file" accept="application/json,.json" hidden>
  </div>
  <div class="folder-banner" id="folderBanner" hidden></div>
</header>

<div class="app">
  <nav class="steps" id="steps" aria-label="할 일 단계"></nav>
  <main class="stepmain" id="stepmain"></main>

<script>
(() => {
  const KEY = 'familyTheaterAdmin.v3';
  const OLD_KEY = 'familyTheaterAdmin.v2';
  const UI_KEY = 'familyTheaterAdmin.ui2';
  const has = s => typeof s === 'string' && s.trim() !== '';
  const arr = a => Array.isArray(a) ? a : [];
  const obj = o => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  const $ = id => document.getElementById(id);
  const clone = o => JSON.parse(JSON.stringify(o));
  /** 문장 끝 온점(.) 뒤에서 줄을 바꾼다. 숫자 뒤 온점과 파일명은 그대로 둔다. */
  const brk = s => typeof s === 'string' ? s.replace(/([^\d\s])\.[ \t]+(?=\S)/g, '$1.\n') : s;
  const TOPIC_LABELS = ['연결', '발견', '즐거움'];

  /* ---------- 폼 스키마 ---------- */
  const T = (key, label, o = {}) => ({ type: 'text', key, label, ...o });
  const A = (key, label, o = {}) => ({ type: 'area', key, label, ...o });
  const RR = (label, items, o = {}) => ({ type: 'rangerow', label, items, ...o });   // 슬라이더 여러 개를 한 줄에
  const R = (key, label, o = {}) => ({ type: 'range', key, label, ...o });
  const S = (key, label, options, o = {}) => ({ type: 'select', key, label, options, ...o });
  const F = (key, label, kind, o = {}) => ({ type: 'file', key, label, kind, ...o });

  const TOOLS_LIST = () => ({ type: 'list', key: 'tools', itemLabel: i => `AI 도구 ${i + 1}`, addLabel: 'AI 도구 추가',
    fields: [
      T('name', '도구 이름', { req: 1, list: 'dl-tools', ph: '예) ○○ 이미지 생성 AI', hint: '앞에서 쓴 도구는 자동완성돼요.' }),
      T('purpose', '무엇에 썼나요', { ph: '예) 장면별 일러스트 만들기' }),
      { type: 'list', key: 'prompts', itemLabel: i => `프롬프트 ${i + 1}`, addLabel: '프롬프트 추가', fields: [
        T('title', '프롬프트 이름', { ph: '예) 거실 장면' }),
        A('text', 'AI에 넣은 문장 (프롬프트)', { req: 1, big: 1, rows: 8, ph: '예) 따뜻한 오후 햇살이 드는 거실, 할머니와 손주가 함께 앨범을 넘기는 모습, 수채화 일러스트',
          hint: '쓴 그대로 붙여 넣어요. 줄바꿈과 띄어쓰기가 그대로 남아요.\nCtrl+Enter를 누르면 다음 프롬프트가 생겨요.' }),
        { type: 'list', key: 'refs', itemLabel: i => `참고 이미지 ${i + 1}`, addLabel: '참고 이미지 추가', fields: [
          F('file', '이미지', 'image', { hint: '이 프롬프트를 만들 때 AI에 같이 넣은 이미지예요. 여러 장 올릴 수 있어요.' }),
          T('caption', '설명 (선택)', { ph: '예) 어릴 적 부엌 사진' })] }] }] });
  const ROLES_GROUP = () => ({ group: 'roles', cols: 2, fields: [
    { type: 'list', key: 'ai', str: true, itemLabel: i => `AI ${i + 1}`, addLabel: 'AI가 한 일 추가', title: 'AI가 한 일', ph: '예) 장면별 일러스트 12장 만들기' },
    { type: 'list', key: 'human', str: true, itemLabel: i => `내가 ${i + 1}`, addLabel: '내가 한 일 추가', title: '내가 한 일', ph: '예) 시나리오 쓰기, 영상 편집' }] });
  const SOURCES_TABLE = () => ({ type: 'list', key: 'sources', table: true, itemLabel: i => `자료 ${i + 1}`, addLabel: '줄 추가', fields: [
    T('item', '무엇을 썼나요', { ph: '예) 배경 음악' }), T('source', '어디서 가져왔나요', { ph: '예) 직접 연주 / 음원 사이트 이름' }),
    T('license', '쓴 방법과 허락 여부', { ph: '예) 직접 만듦 / 상업적 이용 허락 확인' })] });
  const STEPS_LIST = key => ({ type: 'list', key, itemLabel: i => `단계 ${i + 1}`, addLabel: '단계 추가', fields: [
    T('title', '단계 이름', { ph: '예) 이야기 모으기' }), A('desc', '한 일', { rows: 3, ph: '예) 가족과 인터뷰하며 기억에 남는 장면 열 가지를 골랐어요.' })] });

  const PH = s => /\[예시\]/.test(s || '') || /^\s*\[[^\]]*\]\s*$/.test(s || '');
  const st = v => !has(v) ? 0 : PH(v) ? 1 : 2;      // 0 비어 있음 · 1 예시 문구 · 2 완료
  const best = a => a.length ? Math.max(...a) : 0;
  const worst = a => a.length ? Math.min(...a) : 0;
  const ck = (label, s, req, ...ks) => ({ label, s, req, ks });
  const WATCH = 'watch.html';

  /* 단계: scope(work=선택한 작품, site=사이트 공통), pv=[페이지, 섹션], parts=[{ title, desc, pv, adv, fields }] */
  const ALL_STEPS = [
    { id: 'video', scope: 'work', title: '작품 올리기', pv: [WATCH, 'player'],
      why: '작품 종류를 고르고, 연재물이면 시리즈를 정해요. 그다음 영상(또는 게임·앱·스토리보드)과 포스터를 올리면 오른쪽에서 상영관 모습을 바로 볼 수 있어요.',
      parts: [{ fields: [
        S('kind', '작품 종류', [['video', '영상'], ['game', '게임'], ['app', '앱'], ['storyboard', '스토리보드']], { rerender: true, hint: '영상은 mp4 파일, 게임·앱은 배포한 주소, 스토리보드는 이미지 여러 장(또는 PDF)을 올려요.' }),
        S('series', '연재물인가요?', () => {
          const w = data.works[ui.work] || {};
          return [['', '단독 작품 (연재물 아님)'], ...data.series.filter(x => mine(x) || x.id === w.series).map(x => { const c = (data.works.find(y => y.series === x.id && has(y.creator)) || {}).creator; return [x.id, (has(x.title) ? x.title : '(제목 없음)') + (has(c) ? ` (© ${c})` : '')]; }), ['__new', '＋ 새 연재물 만들기…']];
        },
          { rerender: true, show: () => !online || isAdmin() || data.series.some(x => mine(x)) || !!(data.works[ui.work] || {}).series,
            hint: '연재물이면 시리즈를 고르거나 새로 만들어요. 총 몇 화일지는 몰라도 돼요. 시리즈 소개·대표 포스터는 7단계에서 고쳐요.',
            onChange: (v, o) => setSeriesFor(o, v) }),
        T('episode', '회차 번호 (몇 화)', { ph: '예) 3', show: () => { const w = data.works[ui.work] || {}; return !!w.series && !isSolo(w); },
          hint: '1, 2, 3처럼 숫자로 적어요. 새 편이 나오면 작품을 추가하고 같은 시리즈를 고른 뒤 다음 번호를 적어요.' })] },
        { fields: [
          { group: 'video', fields: [
            F('file', '영상 파일', 'video', { show: () => kindOf() === 'video', hint: '5분 이내 mp4 파일이에요. 비워 두면 "영상을 불러오지 못했습니다" 안내가 나와요.' }),
            { type: 'check', key: 'portrait', label: '세로 영상 (세로형 9:16 화면으로 보여주기)', show: () => kindOf() === 'video' },
            F('cover', '상영관 표지 (선택)', 'image', { show: () => kindOf() === 'video', hint: '재생 전에 영상 화면에 먼저 보이는 이미지예요.\n가로 영상은 16:9(1920×1080px), 세로 영상은 9:16(1080×1920px)을 권장해요.\n비워 두면 영상의 첫 장면이 나와요.' }),
            { type: 'check', key: 'coverLogo', label: '표지 위에 로고 얹기 (연재물 로고 사용)', rerender: true, show: () => kindOf() === 'video' },
            RR('표지 로고 위치·크기', [{ key: 'coverLogoX', label: '가로', min: 0, max: 100, def: 50 }, { key: 'coverLogoY', label: '세로', min: 0, max: 100, def: 50 }, { key: 'coverLogoW', label: '크기', min: 10, max: 100, def: 40 }], { show: () => kindOf() === 'video' && !!obj(data.works[ui.work].video).coverLogo, hint: '영상을 재생하면 로고는 사라져요. 크기는 영상 폭 비율이에요.' }),
            F('poster', '포스터 사진', 'image', { hint: '세로 2:3 비율, 1500×2168px(기본 포스터 규격)을 권장해요. 다른 비율은 가운데만 남기고 위아래·좌우가 잘려요. 목록과 상영관에 나와요.' }),
            F('logo', '작품 로고 (선택, 포스터 위에 얹기)', 'image', { show: () => { const x = seriesOf(data.works[ui.work]); return !x || x.solo; }, hint: '올리면 포스터 아래쪽 가운데에 자동으로 얹혀요. 투명 배경 PNG가 좋아요. 연재물은 "연재물 정보 고치기"에서 올려요.' }),
            RR('로고 위치·크기', [{ key: 'logoX', label: '가로', min: 0, max: 100, def: 50 }, { key: 'logoY', label: '세로', min: 0, max: 100, def: 85 }, { key: 'logoW', label: '크기', min: 20, max: 100, def: 80 }], { show: () => { const x = seriesOf(data.works[ui.work]); return !x || x.solo; }, hint: '가로·세로는 0~100(세로 기본 85=아래쪽), 크기는 포스터 폭 비율이에요.' }),
            T('duration', '영상 길이', { ph: '03:30', show: () => kindOf() === 'video' }),
            F('endCover', '끝 화면 이미지 (선택)', 'image', { show: () => kindOf() === 'video', hint: '영상이 끝나면 영상 화면에 보이는 가로 이미지예요. 다시 재생하면 사라져요.\n예) "다음 화에서 계속됩니다." 이미지. 가로 16:9, 1920×1080px 권장이에요.\n비워 두면 아무것도 보이지 않아요.' }),
            F('captions', '자막 파일 (있으면)', 'vtt', { show: () => kindOf() === 'video', hint: '.vtt 또는 .srt 파일을 올리면 돼요. .srt 는 올릴 때 자동으로 .vtt 로 바뀌어요.' }),
            { type: 'check', key: 'showDownload', label: '영상 아래에 다운로드 버튼 보이기', show: () => kindOf() === 'video' }] },
          { group: 'game', show: () => kindOf() === 'game', fields: [
            T('url', '게임 주소', { ph: 'https://...', hint: 'itch.io 등 게임이 올라간 주소(https://로 시작)를 붙여 넣어요.' }),
            { type: 'check', key: 'embed', label: '상영관 안에서 바로 실행하기 (안 되는 게임이면 끄세요)' },
            { type: 'check', key: 'portrait', label: '앱용 (세로형 화면으로 보여주기)' },
            A('howto', '게임 하는 방법', { rows: 4, ph: '예) 방향키로 움직이고 스페이스바로 점프해요.' })] },
          { group: 'app', show: () => kindOf() === 'app', fields: [
            T('url', '앱 주소', { ph: 'https://...', hint: '배포한 앱 주소(https://로 시작)를 붙여 넣어요.' }),
            { type: 'check', key: 'embed', label: '상영관 안에서 바로 실행하기 (안 되는 앱이면 끄세요)' },
            { type: 'check', key: 'portrait', label: '앱용 (세로형 화면으로 보여주기)' },
            A('howto', '앱 사용 방법', { rows: 4, ph: '예) 사진을 올리면 가족 카드가 만들어져요.' })] },
          { group: 'storyboard', show: () => kindOf() === 'storyboard', fields: [
            { type: 'list', key: 'pages', itemLabel: i => `장면 ${i + 1}`, addLabel: '장면 추가', fields: [
              F('file', '장면 이미지', 'image'), T('caption', '설명 (선택)', { ph: '예) 1컷: 할머니 부엌' })] },
            F('pdf', 'PDF 파일 (있으면)', 'pdf', { hint: '이미지 대신 또는 이미지와 함께 PDF를 올릴 수 있어요.' })] }] }],
      checks: w => w.kind === 'game' ? [ck('게임 주소', st(obj(w.game).url), false, 'url'), ck('포스터 사진', st(obj(w.video).poster), false, 'poster')]
        : w.kind === 'app' ? [ck('앱 주소', st(obj(w.app).url), false, 'url'), ck('포스터 사진', st(obj(w.video).poster), false, 'poster')]
        : w.kind === 'storyboard' ? [ck('스토리보드 장면 1장 이상', best(arr(obj(w.storyboard).pages).map(x => st(x.file))), false, 'file'), ck('포스터 사진', st(obj(w.video).poster), false, 'poster')]
        : [ck('영상 파일', st(obj(w.video).file), false, 'file'), ck('포스터 사진', st(obj(w.video).poster), false, 'poster'), ck('영상 길이', st(obj(w.video).duration), false, 'duration')] },
    { id: 'intro', scope: 'work', title: '작품 소개 쓰기', pv: [WATCH, 'info'],
      why: '제목과 한 줄 소개, 기획 의도가 상영관 영상 아래에 나와요.',
      parts: [{ pv: [WATCH, 'info'], fields: [
        T('title', '제목', { req: 1, autoId: 1, ph: '예) 할머니의 부엌' }),
        T('creator', '제작자 이름 (© 표시)', { ph: '예) 김○○ 가족', hint: '상영관과 목록에 "© 이름"으로 나와요. 로그인 이메일은 공개되지 않아요.' }),
        T('cursor', '마우스 모양 (이모지)', { ph: '예) 📷', hint: '이 작품 상영관에서 마우스 포인터 대신 따라다니는 모양이에요.\n이모지 1개를 붙여 넣어요. 비우면 제목에 맞춰 정해지고, 해당이 없으면 홈 모양을 써요.' }),
        F('cursorImage', '마우스 그림 (선택)', 'image', { hint: '이모지 대신 쓸 그림이에요. 정사각형 투명 PNG, 64×64px 이상이에요.' }),
        T('tagline', '한 줄 소개', { ph: '예) 냄새와 소리로 기억하는 할머니의 부엌을 그림으로 되살렸어요.' }),
        A('intent', '기획 의도', { rows: 7, ph: '왜 이 주제를 골랐는지, 영상으로 무엇을 전하고 싶은지, AI를 어떻게 썼는지를 2~3문단으로 적어요.', hint: '문단 사이에 빈 줄을 넣어요.' })] },
        { title: '고급: 작품 주소(ID)', adv: true, fields: [T('id', '작품 주소(ID)', { sanitize: true, ph: 'work-1',
          hint: '제목을 처음 쓰면 자동으로 만들어져요.\n영문 소문자·숫자·하이픈만 쓰고, 작품마다 달라야 해요.\n이미 사이트에 올린 뒤에 바꾸면 작품 주소가 달라져요.' })] }],
      checks: w => [ck('제목', st(w.title), false, 'title'), ck('한 줄 소개', st(w.tagline), false, 'tagline'), ck('기획 의도', st(w.intent), false, 'intent'),
        ck('작품 주소(ID) – 영문·숫자·하이픈, 중복 없음', workIdOk(w) ? 2 : 0, false, 'id')] },
    { id: 'process', scope: 'work', prod: true, title: '만든 과정 쓰기', pv: [WATCH, 'process'],
      why: '이 작품을 어떻게 만들었는지 순서대로 적어요. 모든 작품에 공통인 과정은 메이킹 페이지 공통 단계에 써요.',
      parts: [{ fields: [STEPS_LIST('process')] }],
      checks: w => [ck('만든 과정 1단계 이상', best(arr(w.process).map(p => Math.min(st(p.title), st(p.desc)))), false, 'title', 'desc')] },
    { id: 'tools', scope: 'work', prod: true, title: 'AI 도구·프롬프트', pv: [WATCH, 'tools'],
      why: '심사에서 꼭 보는 항목이에요. 어떤 AI를 썼고 어떤 문장을 넣었는지 그대로 적어요.',
      parts: [{ fields: [TOOLS_LIST()] }],
      checks: w => [ck('사용한 AI 도구', best(arr(w.tools).map(t => st(t.name))), true, 'name'), ck('주요 프롬프트', best(arr(w.tools).flatMap(t => arr(t.prompts)).map(p => st(p.text))), true, 'text')] },
    { id: 'roles', scope: 'work', prod: true, title: 'AI가 한 일·내가 한 일', pv: [WATCH, 'roles'],
      why: '심사에서 꼭 보는 항목이에요. 구체적인 작업 단위로 나눠 적어요.\n예) AI: 장면별 일러스트 12장 만들기 / 내가: 시나리오 쓰기, 영상 편집',
      parts: [{ fields: [ROLES_GROUP()] }],

      el('p', { text: adminMade ? '관리자가 만든 작품은 평소에 편집자 누구나 고칠 수 있어요.\n잠그면 아래에서 고른 사람만 고칠 수 있어요. 관리자는 항상 고칠 수 있어요.' : '이 작품은 관리자가 만든 것이 아니라서, 원래 담당자와 관리자만 고칠 수 있어요.\n잠금은 관리자가 만든 작품에만 쓰여요.', style: 'white-space:pre-line;margin:0' }),
      el('label', { class: 'cb', for: 'lkOn' }, on, '이 작품 잠그기'),
      list, ...(serOk ? [el('label', { class: 'cb', for: 'lkSer' }, withSer, '이 연재물(공통 제작 정보)에도 같은 잠금 적용')] : []),
      el('div', { class: 'row' }, el('button', { type: 'button', class: 'btn primary', text: '적용', onclick: apply }),
        el('button', { type: 'button', class: 'btn', text: '닫기', onclick: () => { dlg.close(); dlg.remove(); } })));
    document.body.append(dlg); dlg.showModal();
  }

  async function openEditors() {
    const dlg = el('dialog', { id: 'editors', 'aria-labelledby': 'edT' }), list = el('ul', { class: 'ed-list' });
    const email = el('input', { type: 'email', placeholder: '추가할 사람의 이메일', 'aria-label': '추가할 이메일' });
    const memo = el('input', { type: 'text', placeholder: '이름·메모 (예: 이은지, 3화 담당)', 'aria-label': '이름 또는 메모', maxlength: 40 });
    let hasMemo = true;
    const role = el('select', { class: 'fld', 'aria-label': '권한', style: 'width:auto' }, el('option', { value: 'editor', text: '편집자' }), el('option', { value: 'admin', text: '관리자' }));
    async function draw() {
      let rows;
      try { rows = await getJson('ourfamilymeta_editors?select=email,role,memo&order=created_at'); }
      catch (e) { hasMemo = false; rows = await getJson('ourfamilymeta_editors?select=email,role&order=created_at'); }   // memo 칸이 아직 없으면 예전 방식
      const admins = rows.filter(r => r.role === 'admin').length;
      list.replaceChildren(...rows.map(r => el('li', {}, el('span', { class: 'ed-who' }, el('strong', { text: r.memo || '' }), el('span', { text: r.email + (r.role === 'admin' ? ' (관리자)' : '') }),
          hasMemo ? el('button', { type: 'button', class: 'btn sm', text: r.memo ? '이름 수정' : '이름 적기', onclick: async () => {
            const v = prompt('이름이나 메모를 적어 주세요.\n비우면 지워요.', r.memo || ''); if (v === null) return;
            try { await sbFetch('/rest/v1/ourfamilymeta_editors?email=eq.' + encodeURIComponent(r.email), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ memo: v.trim() || null }) }); await draw(); } catch (e) { toast('저장 실패: ' + e.message); }
          } }) : null),
        el('button', { type: 'button', class: 'btn sm', text: '제거', disabled: r.role === 'admin' && admins <= 1, title: r.role === 'admin' && admins <= 1 ? '마지막 관리자는 제거할 수 없어요.' : null,
          onclick: async () => {
            if (!await confirmDelete(`${r.email} 님의 편집 권한을 없애요.\n이 사람은 더 이상 CMS에서 작품을 올리거나 고칠 수 없어요.`)) return;
            try { await sbFetch('/rest/v1/ourfamilymeta_editors?email=eq.' + encodeURIComponent(r.email), { method: 'DELETE' }); await draw(); } catch (e) { toast('제거 실패: ' + e.message); }
          } }))));
    }
    const add = async () => {
      const v = email.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { toast('이메일 형식이 맞지 않아요.'); return; }
      try { await sbFetch('/rest/v1/ourfamilymeta_editors', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(hasMemo && memo.value.trim() ? { email: v, role: role.value, memo: memo.value.trim() } : { email: v, role: role.value }) }); email.value = ''; memo.value = ''; await draw(); toast('등록했어요.\n그 사람이 이 주소에서 같은 이메일로 가입·로그인하면 바로 편집할 수 있어요.'); }
      catch (e) { toast('등록 실패: ' + (/duplicate|unique|already/i.test(e.message) ? '이미 등록된 이메일이에요.' : e.message)); }
    };
    dlg.append(el('h2', { id: 'edT', text: '편집자 관리' }),
      el('p', { text: '여기에 등록한 이메일로 가입·로그인한 사람만 올리고 고칠 수 있어요.\n사람 수에는 제한이 없어요.', style: 'white-space:pre-line;margin:0' }),
      list, email, memo, el('div', { class: 'row' }, role, el('button', { type: 'button', class: 'btn primary', text: '추가', onclick: add }),
        el('button', { type: 'button', class: 'btn', text: '닫기', onclick: () => { dlg.close(); dlg.remove(); } })));
    document.body.append(dlg); dlg.showModal();
    try { await draw(); } catch (e) { toast('목록을 불러오지 못했어요: ' + e.message); }
  }
  const MIME = { pdf: 'application/pdf', mp4: 'video/mp4', vtt: 'text/vtt', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' };
  /** 파일을 Storage에 올리고 공개 주소를 돌려준다. 실패하면 빈 문자열 */
  async function uploadFile(file) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!MIME[ext]) { toast('올릴 수 없는 파일이에요. (mp4, vtt, pdf, jpg, png, webp만 돼요)'); return ''; }
    if (file.size > MAX_UPLOAD) { toast(`파일이 ${fmtSize(file.size)}예요. 50MB 이하만 올릴 수 있어요.\n영상은 용량을 줄이거나 길이를 나눠 주세요.`, { ms: 7000 }); return ''; }
    const path = `${new Date().toISOString().slice(0, 7)}/${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}-${safeName(file.name)}`;
    toast(`"${file.name}" 올리는 중… (${fmtSize(file.size)})`, { ms: 2500 });
    try {
      await sbFetch(`/storage/v1/object/${BUCKET}/${path}`, { method: 'POST', headers: { 'Content-Type': MIME[ext], 'x-upsert': 'false' }, body: file });
      return `${SB_URL}/storage/v1/object/public/${BUCKET}/${path}`;
    } catch (e) { toast('올리지 못했어요: ' + e.message, { ms: 6000 }); return ''; }
  }

  /* ---------- 시작 ---------- */
  new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('top').offsetHeight + 'px')).observe($('top'));
  window.__adminConnect = h => { dir = h; pending = null; folderUi(); };   // 시험용: 사용자가 고른 폴더 핸들 대신 임의의 디렉터리 핸들 연결
  (async () => {
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(KEY)) || JSON.parse(localStorage.getItem(OLD_KEY)); } catch {}
    const h = fsOk ? await kvGet('dir') : null;
    if (h && !online) { try { if (await perm(h, false)) dir = h; else pending = h; } catch { pending = null; } }
    if (online) {
      stored = null;
      try { await ensureLogin(); const r = await loadOnline(); data = normalize(r.d || await fetchFile()); markSnap(r); }
      catch (e) { document.body.append(el('p', { text: '불러오지 못했어요: ' + e.message + '\n새로고침해 주세요.', style: 'white-space:pre-line;padding:24px' })); throw e; }
    } else data = normalize(stored || await fetchFile());
    pvLabel(); folderUi(); renderStatus(); renderStep();
    if (stored) { dirty = true; renderStatus(); }
    let seen = false; try { seen = !!localStorage.getItem('familyTheaterAdmin.intro'); } catch {}
    if (!seen) $('intro').showModal();
  })();
})();
</script>
</body>
</html>
