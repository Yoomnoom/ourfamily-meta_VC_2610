<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상영관 – 우리 가족 극장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d3202f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div id="app"></div>
<script src="common.js"></script>
<script>
(() => {
  const { h, has, arr, obj, frameStatus, TITLES, workId, watchHref, poster, buildVideo, section, timeline, tools, toolList, roles, sourcesTable, href, mediaPath, boot, params, listing, metaLine, safeUrl, gallery, production, credit, rail } = App;

  boot((d, site, av) => {
    const name = has(site.name) ? site.name : '우리 가족 극장';
    const T = { ...TITLES, ...obj(d.sectionTitles) };
    const works = arr(d.works), want = params.get('id');
    let idx = works.findIndex((w, i) => workId(w, i) === want);
    if (idx < 0 && !want && works.length) idx = 0;
    if (idx < 0) return { title: '작품을 찾을 수 없어요 – ' + name, main: h('main', { id: 'main', class: 'wrap notice card' },
      h('h1', { text: '작품을 찾을 수 없어요' }),
      h('p', { text: '주소가 잘못되었거나 작품이 삭제되었을 수 있어요.' }),
      h('a', { class: 'btn', href: href('works.html') }, '상영작에서 작품 고르기')) };

    const w = works[idx], v = w.video || {};
    const ser0 = has(w.series) ? arr(d.series).find(x => x.id === w.series) : null;
    const ser = ser0 && !ser0.solo ? ser0 : null;   // 단독 작품의 숨은 연재물은 연재물처럼 보이지 않는다
    const cur = App.cursorSpec(w.cursor, w.cursorImage, w.title, ser && ser.title) || App.siteCursor(site);
    App.setCursor(cur);   // 작품 주제에 맞는 마우스 모양
    const pr = production(w, d);   // 연재물 공통 제작 정보 + 이 회차 추가분 (미리보기와 같은 함수)
    const cleanT = t => String(t || '').replace(/^\s*\[연재\]\s*/, '').replace(/\s*\d+화\s*$/, '').trim();   // 회차 제목에서 '[연재]'와 끝의 'N화'는 뺀다 (시리즈명·회차 번호는 따로 보여 준다)
    const title = has(w.title) ? (w.series ? cleanT(w.title) || w.title : w.title) : '제목 미정';
    const main = h('main', { id: 'main', class: 'pad' });
    const ICO = { camera: '<path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
      monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
      doc: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
      clapper: '<rect x="3" y="10" width="18" height="11" rx="1.5"/><path d="M3 10l2.5-5 4 1L7 10M10 6l4 1-2.5 3M14.5 7l4 1L16 10"/>',
      chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
      layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5M3 17l9 5 9-5"/>' };
    const ico = k => { const e = h('span', { class: 'ico', 'aria-hidden': 'true' });
      e.innerHTML = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICO[k] + '</svg>'; return e; };
    /* "게임 방법" 글을 소개문 · 번호 단계 · 맺음말로 나눈다 (번호 단계가 2개 미만이면 나누지 않고 글 그대로 보여준다) */
    const parseHow = txt => {
      const pre = [], post = [], steps = []; let st = 'pre';
      for (const ln of String(txt).split(/\r?\n/).map(s => s.trim())) {
        if (!ln) { if (st === 'steps') st = 'post'; continue; }
        const m = ln.match(/^(\d+)[.)]\s*(.+)$/);
        if (m) { st = 'steps'; steps.push(m[2]); }
        else if (st === 'steps') steps[steps.length - 1] += ' ' + ln;
        else (st === 'pre' ? pre : post).push(ln);
      }
      return { intro: pre.join(' '), steps, note: post.join(' ') };
    };

    // 상영관 – 플레이어
    const kind = w.kind === 'game' || w.kind === 'app' || w.kind === 'storyboard' ? w.kind : 'video';
    let screen, dl = null, howto = null, openLink = null;
    if (kind === 'game' || kind === 'app') {   // 게임·앱: 주소로 연결 (원하면 화면 안에서 바로 실행). 앱용(세로형)은 휴대폰 화면 비율로 보인다
      const g = obj(w[kind]), url = safeUrl(g.url), noun = kind === 'app' ? '앱' : '게임', tall = g.portrait === true || g.portrait === 'true' ? ' portrait' : '';
      screen = h('div', { class: 'screen-frame' + tall }, !url ? h('div', { class: 'video-fallback' }, h('strong', { text: noun + ' 주소가 아직 없어요' }))
        : [g.embed && h('iframe', { class: 'game-frame' + tall, src: url, title: title + ' ' + noun, allow: 'fullscreen; gamepad', allowfullscreen: true,
            sandbox: 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals allow-downloads', loading: 'lazy' }),
          !g.embed && h('p', { class: 'game-cta' }, h('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener noreferrer' }, kind === 'app' ? '앱 열기' : '게임 하러 가기'))]);
      const fr = screen.querySelector('iframe');
      if (fr) {
        screen.append(frameStatus(fr, noun));
        // 게임 화면 안에는 사이트의 마우스 모양이 못 들어가서, 게임이 원하면 직접 그리도록 모양을 알려 준다 (게임이 이 메시지를 받아야 쓰인다)
        const msg = { type: 'ft-cursor', text: cur.text || '', img: cur.img ? new URL(cur.img, location.href).href : '' };
        fr.addEventListener('load', () => { try { fr.contentWindow.postMessage(msg, new URL(url).origin); } catch (e) {} });
      }   // 게임이 늦게 열리면 이유를 알려 준다
      if (url && g.embed) openLink = h('a', { class: 'btn ghost sm', href: url, target: '_blank', rel: 'noopener noreferrer' }, '새 창에서 열기');   // 화면 안이 아니라 제목 옆에 둔다
      if (has(g.howto)) {
        const hw = parseHow(g.howto);
        howto = hw.steps.length < 2 ? h('div', { class: 'game-how' }, h('h2', { text: noun + ' 방법' }), h('p', { class: 'prose', raw: true, text: g.howto.trim() }))
          : h('div', { class: 'game-how how-card' },
              h('div', { class: 'how-head' }, ico('camera'), h('h2', { text: noun + ' 방법' }), hw.intro && h('p', { class: 'how-intro', text: hw.intro })),
              h('ol', { class: 'how-steps' }, hw.steps.map(s => h('li', {}, h('span', { text: s })))),
              hw.note && h('p', { class: 'how-note' }, ico('monitor'), h('span', { text: hw.note })));
      }
    } else if (kind === 'storyboard') {   // 스토리보드: 장면 이미지 + PDF
      const sb = obj(w.storyboard), pages = arr(sb.pages).filter(x => x && has(x.file));
      screen = h('div', { class: 'screen-frame sb-frame' }, pages.length ? gallery(pages) : !has(sb.pdf) && h('div', { class: 'video-fallback' }, h('strong', { text: '스토리보드가 아직 없어요' })),
        has(sb.pdf) && h('p', { class: 'game-cta' }, h('a', { class: 'btn', href: mediaPath(sb.pdf), target: '_blank', rel: 'noopener noreferrer' }, 'PDF로 보기')));
    } else {
      dl = v.showDownload && has(v.file) && h('div', { class: 'dl' }, App.dlLink(v.file, '영상 다운로드', 'btn ghost sm'));
      screen = h('div', { class: 'screen-frame' + (v.portrait === true || v.portrait === 'true' ? ' portrait' : '') }, buildVideo(v, title, () => dl && dl.remove()));
      const cl = ser && !ser.solo ? ser.logo : v.logo, vid = screen.querySelector('video');
      if (vid) vid.addEventListener('loadedmetadata', () => { if (vid.videoHeight > vid.videoWidth) screen.classList.add('portrait'); });   // 체크를 깜빡해도 세로 영상이면 세로 틀로   // 표지 위 로고: 연재물 로고(단독 작품은 작품 로고)를 불러와 쓴다
      if (v.coverLogo && has(cl) && vid) {
        const num = (k, d, lo, hi) => has(String(v[k] ?? '')) && isFinite(+v[k]) ? Math.min(hi, Math.max(lo, +v[k])) : d;
        const li = h('img', { class: 'cover-logo', src: mediaPath(cl), alt: '', draggable: 'false',
          style: `left:${num('coverLogoX', 50, 0, 100)}%;top:${num('coverLogoY', 50, 0, 100)}%;width:${num('coverLogoW', 40, 10, 100)}%` });
        li.addEventListener('error', () => li.remove());
        vid.addEventListener('play', () => li.classList.add('gone'), { once: true });
        screen.append(li);
      }
    }
    // 다음 화·이전 화 (연재물) / 다른 작품으로 이동
    const epList = ser ? works.filter(e => e.series === ser.id).sort((a, b) => (+a.episode || 0) - (+b.episode || 0)) : [];
    
    const epThumb = e => {   // 회차 썸네일: 가로 표지가 있으면 그것, 없으면 포스터
      const f = obj(e.video).cover || obj(e.video).poster, box = h('span', { class: 'ep-thumb' + (has(obj(e.video).cover) ? '' : ' tall'), 'aria-hidden': 'true' });   // 세로 포스터는 자르지 않고 통째로(contain)
      if (has(f)) { const img = h('img', { src: mediaPath(f), alt: '', loading: 'lazy', draggable: 'false' }); img.addEventListener('error', () => img.remove()); box.append(img); }
      return box;
    };
    main.append(h('section', { class: 'screen', 'data-section': 'player', 'aria-label': '상영관' }, h('div', { class: 'wrap' }, screen, dl)));

    const side = ser && h('aside', { class: 'ep-side', id: 'episodes', 'aria-label': ser.title + ' 회차' },
      h('h2', { text: ser.title + ' 회차' }),
      rail(h('ol', { class: 'eps' }, epList.map(e =>
        h('li', {}, h('a', { href: watchHref(e, works.indexOf(e)), 'aria-current': e === w ? 'true' : null },
          epThumb(e), h('span', { text: `${has(e.episode) ? e.episode + '화' : '연재'} · ${has(e.title) ? (cleanT(e.title) || e.title) : '제목 미정'}` })))))));
    const jumps = [];
    main.append(h('section', { class: 'movie', 'data-section': 'info', 'aria-label': '작품 정보' }, h('div', { class: 'wrap movie-grid' + (side ? ' has-side' : '') },
      openLink ? h('div', { class: 'title-row' }, h('h1', { text: title }), openLink) : h('h1', { text: title }),
      h('div', {},
        h('p', { class: 'meta meta-line' }, App.kindPill(w),
          ser && h('span', { text: `${ser.title} · ${has(w.episode) ? w.episode + '화' : '연재'}` }),
          has(v.duration) && h('span', { text: '러닝타임 ' + v.duration.trim() }),
          has(credit(w)) && h('span', { text: credit(w) })),
        has(w.tagline) && h('p', { class: 'tagline', text: w.tagline })), side || null)));

    if (howto) main.append(h('section', { class: 'howto-sec', 'data-section': 'howto', 'aria-label': kind === 'app' ? '앱 방법' : '게임 방법' }, h('div', { class: 'wrap' }, howto)));

    // 작품 설명: 탭 (기획 의도 / 창작 과정 / AI 도구·프롬프트 / 역할·출처)
    const tabs = [];   // [id, 이름, 내용]
    if (has(w.intent)) tabs.push(['intent', '기획 의도', h('p', { class: 'prose', raw: true, text: w.intent.trim() })]);
    const tl = timeline(pr.process); if (tl) tabs.push(['process', '창작 과정', tl]);
    if (toolList(pr.tools).length) tabs.push(['tools', 'AI 도구·프롬프트', tools(pr.tools)]);
    const ro = roles(pr.roles, T), src = sourcesTable(pr.sources, T.sources);
    if (ro || src) tabs.push(['credits', '역할·출처', [
      ro && h('div', { class: 'tab-block', 'data-section': 'roles' }, h('h3', { text: T.roles }), ro),
      src && h('div', { class: 'tab-block', 'data-section': 'sources' }, h('h3', { text: T.sources }), src)]]);
    if (tabs.length) {
      const ids = tabs.map(t => t[0]), alias = { roles: 'credits', sources: 'credits' };
      const list = h('div', { class: 'tablist', role: 'tablist', 'aria-label': '작품 설명' }), panels = h('div', { class: 'tabpanels' }), btn = {}, pan = {};
      const fromHash = () => { let k = ''; try { k = decodeURIComponent(location.hash.slice(1)); } catch (e) {} k = alias[k] || k; return ids.includes(k) ? k : null; };
      const show = id => ids.forEach(k => { const on = k === id;
        btn[k].setAttribute('aria-selected', on ? 'true' : 'false'); btn[k].tabIndex = on ? 0 : -1; btn[k].classList.toggle('on', on); pan[k].hidden = !on; });
      tabs.forEach(([id, label, body]) => {
        btn[id] = h('button', { type: 'button', class: 'tab', role: 'tab', id: 'tab-' + id, 'aria-controls': 'panel-' + id }, ico({ intent: 'doc', process: 'clapper', tools: 'chip', credits: 'layers' }[id] || 'doc'), h('span', { text: label }));
        pan[id] = h('div', { class: 'tabpanel', role: 'tabpanel', id: 'panel-' + id, 'aria-labelledby': 'tab-' + id, 'data-section': id === 'credits' ? null : id }, body);
        btn[id].addEventListener('click', () => {
          show(id);
          if (location.hash !== '#' + id) { try { history.pushState(null, '', '#' + id); } catch (e) {} }   // 주소만 바꾸고 스크롤은 하지 않는다
        });
        list.append(btn[id]); panels.append(pan[id]);
      });
      list.addEventListener('keydown', e => {
        const at = ids.findIndex(k => btn[k] === document.activeElement); if (at < 0) return;
        const to = { ArrowRight: (at + 1) % ids.length, ArrowLeft: (at + ids.length - 1) % ids.length, Home: 0, End: ids.length - 1 }[e.key];
        if (to == null) return; e.preventDefault(); btn[ids[to]].focus(); btn[ids[to]].click();
      });
      if (av.making) { const more = h('div', { class: 'more' }, h('a', { class: 'btn ghost', href: href('making.html') }, '이 작품의 메이킹 더 보기'));
        pan[ids.includes('process') ? 'process' : ids[0]].append(more); }
      show(fromHash() || ids[0]);
      window.onpopstate = window.onhashchange = () => show(fromHash() || ids[0]);   // 뒤로 가기·주소 직접 변경
      main.append(h('section', { class: 'tabs-sec', 'data-section': 'tabs', 'aria-label': '작품 설명' }, h('div', { class: 'wrap' }, list, panels)));
    }

    const world = App.relatedOf(w, d), worldIds = new Set(world.map(o => o.id));
    const card = ([o, i]) => h('a', { href: watchHref(o, i) }, poster(o), App.kindPill(o),
      h('h3', { text: has(o.title) ? o.title : '제목 미정' }),
      has(metaLine(o)) && h('p', { class: 'meta', text: metaLine(o).replace('러닝타임 ', '') }));
    if (world.length) main.append(section('world', T.world, '이어서 보면 좋은 작품이에요.', rail(h('div', { class: 'mini' }, world.map((o, i) => card([o, i]))))));
    const others = listing(d).filter(o => !(ser && o.seriesId === ser.id) && o.id !== w.id && !worldIds.has(o.id)).map((o, i) => [o, i]);
    if (others.length) main.append(section('others', T.others, '', rail(h('div', { class: 'mini' }, others.map(([o, i]) =>
      h('a', { href: watchHref(o, i) }, poster(o), App.kindPill(o),
        h('h3', { text: has(o.title) ? o.title : '제목 미정' }),
        has(metaLine(o)) && h('p', { class: 'meta', text: metaLine(o).replace('러닝타임 ', '') })))))));

    return { title: `${title} – ${name}`, main };
  });
})();
</script>
</body>
</html>
